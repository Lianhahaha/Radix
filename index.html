<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Convert numbers between binary, octal, decimal, and hexadecimal instantly. Includes step-by-step explanations, bit-width viewer, ASCII lookup, and conversion history." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Radix Convert — Number System Converter" />
    <meta property="og:description" content="Convert binary, octal, decimal, hexadecimal and any base from 2 to 36 with step-by-step explanations." />
    <meta property="og:site_name" content="Radix Convert" />
    <meta name="twitter:card" content="summary" />
    <title>Radix Convert — Number System Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap"
    />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('radix-convert-theme');
          var theme = saved === 'dark' || saved === 'light'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) { /* storage unavailable */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 24px; max-width: 48ch; margin: 0 auto;">
        <strong>Radix Convert needs JavaScript.</strong>
        <p style="margin-top: 8px; line-height: 1.5;">
          The converter runs entirely in your browser. Enable JavaScript and reload this page.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
